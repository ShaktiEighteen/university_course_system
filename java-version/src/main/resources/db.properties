# Database Connection Pool Settings
# Primary: MySQL (matches university_db schema)
db.driver=com.mysql.cj.jdbc.Driver
db.url=jdbc:mysql://localhost:3306/university_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
db.user=root
db.password=root

# HikariCP Pool Configuration
hikari.maximumPoolSize=15
hikari.minimumIdle=5
hikari.idleTimeout=30000
hikari.connectionTimeout=20000
hikari.maxLifetime=1800000
