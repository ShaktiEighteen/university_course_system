services:
  - type: web
    name: university-course-system
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate && python manage.py seed_db && python manage.py apply_views
    startCommand: gunicorn course_system.wsgi:application
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DB_ENGINE
        value: sqlite
      - key: PYTHON_VERSION
        value: 3.11.0
