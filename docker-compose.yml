version: '3.8'

services:
  web:
    build: .
    container_name: university_web
    ports:
      - "8000:8000"
    environment:
      - DEBUG=False
      - SECRET_KEY=django-prod-secret-key-university-system
      - DB_ENGINE=sqlite
      - ALLOWED_HOSTS=*
    volumes:
      - db_data:/app

volumes:
  db_data:
